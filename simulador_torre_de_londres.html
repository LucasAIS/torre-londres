<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador Torre de Londres - LATAM</title>
  
  <!-- Tailwind CSS para estilização -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Bibliotecas do React -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel para compilar o código React (JSX) direto no navegador -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50">
  
  <!-- Onde o jogo será renderizado -->
  <div id="root"></div>

  <!-- Script do Jogo -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Cores das esferas
    const COLORS = {
      R: 'bg-red-500',
      G: 'bg-green-500',
      B: 'bg-blue-500'
    };

    // Capacidade de cada haste (Pino 1, Pino 2, Pino 3)
    const PEG_CAPACITIES = [3, 2, 1];

    // 19 Níveis de treinamento progressivo
    const LEVELS = [
      { id: 1, start: [['R', 'G', 'B'], [], []], target: [['R', 'G'], ['B'], []], minMoves: 1 },
      { id: 2, start: [['R', 'G', 'B'], [], []], target: [['R'], ['G'], ['B']], minMoves: 2 },
      { id: 3, start: [['R', 'G', 'B'], [], []], target: [['R', 'B'], ['G'], []], minMoves: 3 },
      { id: 4, start: [['R', 'G', 'B'], [], []], target: [['R'], ['G', 'B'], []], minMoves: 3 },
      { id: 5, start: [['R', 'G', 'B'], [], []], target: [['G', 'R'], ['B'], []], minMoves: 4 },
      { id: 6, start: [['R', 'G', 'B'], [], []], target: [[], ['R', 'G'], ['B']], minMoves: 4 },
      { id: 7, start: [['R', 'G', 'B'], [], []], target: [['G'], ['R', 'B'], []], minMoves: 5 },
      { id: 8, start: [['R', 'G', 'B'], [], []], target: [['G', 'B'], ['R'], []], minMoves: 5 },
      { id: 9, start: [['R', 'G', 'B'], [], []], target: [['B'], ['G', 'R'], []], minMoves: 5 },
      { id: 10, start: [['R', 'G', 'B'], [], []], target: [['B', 'R'], ['G'], []], minMoves: 6 },
      { id: 11, start: [['R', 'G', 'B'], [], []], target: [['B'], ['R', 'G'], []], minMoves: 6 },
      { id: 12, start: [['R', 'G', 'B'], [], []], target: [[], ['G', 'R'], ['B']], minMoves: 6 },
      { id: 13, start: [['R', 'G', 'B'], [], []], target: [['G', 'R', 'B'], [], []], minMoves: 6 },
      { id: 14, start: [['R', 'G', 'B'], [], []], target: [['B', 'G', 'R'], [], []], minMoves: 7 },
      { id: 15, start: [['R', 'G', 'B'], [], []], target: [['B', 'R', 'G'], [], []], minMoves: 7 },
      { id: 16, start: [['R', 'G', 'B'], [], []], target: [['G', 'B', 'R'], [], []], minMoves: 8 },
      { id: 17, start: [['R', 'G', 'B'], [], []], target: [[], ['B', 'G'], ['R']], minMoves: 8 },
      { id: 18, start: [['R', 'G', 'B'], [], []], target: [['R'], ['B', 'G'], []], minMoves: 8 },
      { id: 19, start: [['R', 'G', 'B'], [], []], target: [['R', 'B', 'G'], [], []], minMoves: 9 },
    ];

    const Ball = ({ color, isSelected }) => (
      <div 
        className={`w-10 h-10 rounded-full ${COLORS[color]} border-2 border-gray-800 shadow-md flex-shrink-0 transition-transform ${isSelected ? '-translate-y-4 shadow-lg scale-110 ring-4 ring-yellow-400' : ''}`}
      />
    );

    const Peg = ({ balls, capacity, isSelected, onClick, isTarget = false }) => {
      return (
        <div 
          className={`flex flex-col items-center justify-end w-16 mx-2 cursor-pointer relative ${!isTarget ? 'hover:bg-slate-100 rounded-lg transition-colors' : ''}`}
          onClick={onClick}
          style={{ height: '160px' }}
        >
          <div 
            className="absolute bottom-0 bg-amber-700 rounded-t-md z-0" 
            style={{ width: '8px', height: `${capacity * 40 + 20}px` }} 
          />
          <div className="flex flex-col-reverse items-center justify-start w-full z-10 mb-2 gap-1">
            {balls.map((color, index) => (
              <Ball 
                key={index} 
                color={color} 
                isSelected={!isTarget && isSelected && index === balls.length - 1} 
              />
            ))}
          </div>
          <div className="w-full h-3 bg-amber-800 rounded-sm z-10" />
        </div>
      );
    };

    function TowerOfLondon() {
      const [currentLevel, setCurrentLevel] = useState(0);
      const [board, setBoard] = useState([[], [], []]);
      const [target, setTarget] = useState([[], [], []]);
      const [moves, setMoves] = useState(0);
      const [selectedPeg, setSelectedPeg] = useState(null);
      const [hasWon, setHasWon] = useState(false);
      
      const [timeElapsed, setTimeElapsed] = useState(0);
      const timerRef = useRef(null);

      useEffect(() => {
        loadLevel(currentLevel);
      }, [currentLevel]);

      useEffect(() => {
        if (!hasWon) {
          timerRef.current = setInterval(() => {
            setTimeElapsed(prev => prev + 1);
          }, 1000);
        } else {
          clearInterval(timerRef.current);
        }
        return () => clearInterval(timerRef.current);
      }, [hasWon, currentLevel]);

      const loadLevel = (levelIndex) => {
        const level = LEVELS[levelIndex];
        setBoard(JSON.parse(JSON.stringify(level.start)));
        setTarget(JSON.parse(JSON.stringify(level.target)));
        setMoves(0);
        setSelectedPeg(null);
        setHasWon(false);
        setTimeElapsed(0);
      };

      const formatTime = (seconds) => {
        const m = Math.floor(seconds / 60).toString().padStart(2, '0');
        const s = (seconds % 60).toString().padStart(2, '0');
        return `${m}:${s}`;
      };

      const checkWin = (currentBoard, targetBoard) => {
        return JSON.stringify(currentBoard) === JSON.stringify(targetBoard);
      };

      const handlePegClick = (pegIndex) => {
        if (hasWon) return;

        if (selectedPeg === null) {
          if (board[pegIndex].length > 0) setSelectedPeg(pegIndex);
          return;
        }

        if (selectedPeg === pegIndex) {
          setSelectedPeg(null);
          return;
        }

        const newBoard = [...board];
        const sourcePeg = newBoard[selectedPeg];
        const destPeg = newBoard[pegIndex];

        if (destPeg.length < PEG_CAPACITIES[pegIndex]) {
          const ballToMove = sourcePeg.pop();
          destPeg.push(ballToMove);
          
          setBoard(newBoard);
          setMoves(moves + 1);
          setSelectedPeg(null);

          if (checkWin(newBoard, target)) {
            setHasWon(true);
          }
        } else {
          setSelectedPeg(null);
        }
      };

      return (
        <div className="flex flex-col items-center justify-center min-h-screen p-4 font-sans text-slate-800">
          <div className="max-w-3xl w-full bg-white p-6 rounded-2xl shadow-xl border-t-4 border-blue-800">
            
            <header className="flex flex-col md:flex-row justify-between items-start md:items-end border-b pb-4 mb-6 gap-4">
              <div>
                <h1 className="text-2xl font-bold text-slate-800 uppercase tracking-tight">Torre de Londres</h1>
                <p className="text-sm text-slate-500">Bateria de Testes: 19 Exercícios</p>
              </div>
              
              <div className="flex items-center gap-6 w-full md:w-auto justify-between md:justify-end">
                <div className="text-center bg-slate-100 px-4 py-2 rounded-lg">
                  <span className="block text-xs font-bold text-slate-500 uppercase tracking-wider">Tempo</span>
                  <span className={`text-xl font-mono font-bold ${hasWon ? 'text-green-600' : 'text-slate-800'}`}>
                    {formatTime(timeElapsed)}
                  </span>
                </div>
                <div className="text-right">
                  <span className="block font-bold text-lg text-blue-800">Ex {currentLevel + 1} / {LEVELS.length}</span>
                  <span className="text-sm font-medium text-slate-500">
                    Movs: {moves} <span className="text-slate-300">|</span> Ref: {LEVELS[currentLevel].minMoves}
                  </span>
                </div>
              </div>
            </header>

            <div className="flex flex-col md:flex-row gap-8 justify-between items-center mb-8">
              {/* Área do Alvo */}
              <div className="bg-blue-50 p-4 rounded-xl shadow-inner border border-blue-100 w-full md:w-auto">
                <h2 className="text-center font-bold mb-4 text-sm text-blue-800 uppercase tracking-wider">Objetivo</h2>
                <div className="flex justify-center items-end h-40 scale-75 origin-bottom">
                  {target.map((pegBalls, index) => (
                    <Peg 
                      key={`target-${index}`} 
                      balls={pegBalls} 
                      capacity={PEG_CAPACITIES[index]} 
                      isTarget={true}
                    />
                  ))}
                </div>
              </div>

              {/* Área de Jogo */}
              <div className="flex-1 w-full">
                <h2 className="text-center font-bold mb-4 text-sm text-slate-600 uppercase tracking-wider">Sua Área</h2>
                <div className="flex justify-center items-end h-48 bg-white border-2 border-slate-200 p-4 rounded-xl shadow-sm">
                  {board.map((pegBalls, index) => (
                    <Peg 
                      key={`board-${index}`} 
                      balls={pegBalls} 
                      capacity={PEG_CAPACITIES[index]} 
                      isSelected={selectedPeg === index}
                      onClick={() => handlePegClick(index)}
                    />
                  ))}
                </div>
              </div>
            </div>

            {/* Mensagens e Controles */}
            <div className="flex flex-col items-center gap-4 min-h-[100px]">
              {hasWon ? (
                <div className="bg-green-100 border border-green-500 text-green-800 px-6 py-4 rounded-xl text-center w-full shadow-sm">
                  <h3 className="font-bold text-xl mb-1">Exercício Concluído!</h3>
                  <p className="mb-4 text-sm">Tempo: <strong>{formatTime(timeElapsed)}</strong> | Movimentos: <strong>{moves}</strong></p>
                  {currentLevel < LEVELS.length - 1 ? (
                    <button 
                      onClick={() => setCurrentLevel(currentLevel + 1)}
                      className="bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-8 rounded-lg shadow-md transition-all active:scale-95"
                    >
                      Próximo Exercício ➔
                    </button>
                  ) : (
                    <p className="font-bold text-lg uppercase">Bateria Finalizada com Sucesso!</p>
                  )}
                </div>
              ) : (
                <div className="flex gap-4 mt-4">
                  <button 
                    onClick={() => loadLevel(currentLevel)}
                    className="px-6 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold rounded-lg transition-colors"
                  >
                    ↻ Reiniciar Exercício
                  </button>
                </div>
              )}
            </div>

          </div>
        </div>
      );
    }

    // Renderiza o aplicativo na div root
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<TowerOfLondon />);
  </script>
</body>
</html>
